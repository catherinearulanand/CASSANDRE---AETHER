# Persistent-demo stack (NOT a production deployment). DB port is not published; backend binds to loopback only.
# Usage:  AETHER_DB_PASSWORD=<random> docker compose -f infra/compose.yaml up -d --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: ${AETHER_DB_PASSWORD:?set AETHER_DB_PASSWORD in your environment}
      POSTGRES_DB: aether
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether -d aether"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]
  migrate:
    build: { context: ../backend, dockerfile: ../infra/backend.Dockerfile }
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      AETHER_DATABASE_URL: postgresql+psycopg://aether:${AETHER_DB_PASSWORD}@db:5432/aether
    depends_on: { db: { condition: service_healthy } }
    networks: [internal]
  backend:
    build: { context: ../backend, dockerfile: ../infra/backend.Dockerfile }
    environment:
      AETHER_DATABASE_URL: postgresql+psycopg://aether:${AETHER_DB_PASSWORD}@db:5432/aether
      AETHER_ENVIRONMENT: demo
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports: ["127.0.0.1:8020:8000"]
    volumes: [objects:/app/var/objects, keys:/app/var/keys]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [internal]
volumes: { dbdata: {}, objects: {}, keys: {} }
networks: { internal: {} }
