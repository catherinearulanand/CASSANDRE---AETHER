[project]
name = "aether-backend"
version = "2.0.0-dev"
description = "AETHER 2.0 (Cassandre) - synthetic-data regulatory and margin decision-support overlay"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "SQLAlchemy>=2.0.30",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "python-multipart>=0.0.9",
  "scipy>=1.13",
  "highspy>=1.7",
  "numpy>=1.26",
  "pypdf>=4.0",
  "scikit-learn>=1.5",
  "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["gold: independent golden-case assertions", "security: tenant/auth security tests"]
